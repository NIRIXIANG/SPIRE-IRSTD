name: Fix live project page publication

'on':
  push:
    paths:
      - .github/workflows/fix-live-project-page.yml

permissions:
  contents: write

jobs:
  update-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Replace arXiv link and old citation
        run: echo '' | base64 -d | python
      - name: Commit changes to gh-pages
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'Use official ECCV Springer publication on project page'
          git push origin HEAD:gh-pages
