name: Update ECCV citation

'on':
  push:
    paths:
      - .github/workflows/update-eccv-citation.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update citation
        run: echo '' | base64 -d | python
      - name: Commit
        run: git config user.name github-actions && git config user.email actions@github.com && git add README.md && git diff --cached --quiet || (git commit -m 'Use official ECCV citation in README' && git push)
